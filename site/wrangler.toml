# Sito della suite DockStudio su Cloudflare Pages (progetto "dockstudio": dockstudio.pages.dev, poi getdockstudio.it).
# Pubblicato dal workflow .github/workflows/site-dockstudio.yml. Le pagine si generano con `node site/build.mjs`
# (copia public/ e crea home, /novita/ e le pagine delle app in dist/); in locale si serve la cartella dist/.
name = "dockstudio"
pages_build_output_dir = "dist"
compatibility_date = "2026-10-01"
