# Sito della suite DockStudio su Cloudflare Pages (progetto "dockstudio": dockstudio.pages.dev, poi getdockstudio.it).
# Pubblicato dal workflow .github/workflows/site-dockstudio.yml. Le pagine si generano con `node site/build.mjs`
# (copia public/ e crea home, /novita/ e le pagine delle app in dist/); in locale si serve la cartella dist/.
name = "dockstudio"
pages_build_output_dir = "dist"
compatibility_date = "2026-10-01"

# Pagine riservate /statistiche: Cloudflare Access, la stessa applicazione di screenlove.it/statistiche
# (con in più getdockstudio.it/statistiche tra gli indirizzi protetti). Vedi docs/CLOUDFLARE.md.
[vars]
ACCESS_TEAM_DOMAIN = "frosty-sun-e1a2.cloudflareaccess.com"
ACCESS_AUD = "100e1cfd440c562d4cdb5e638331def3e3b6fea7e040a278823775f39f1e1810"

# Statistiche anonime di tutte le app: lo stesso database D1 di screenlove.it (web/lib/stats.js).
[[d1_databases]]
binding = "STATS"
database_name = "screenlove-stats"
database_id = "2b567977-bfec-4dfe-bd54-60f28e39f4c5"

# Installer, zip e latest.json delle app DockStudio (una cartella per app, vedi site/lib/downloads.js).
# Il workflow del sito crea il bucket se manca, prima di pubblicare.
[[r2_buckets]]
binding = "DOWNLOADS"
bucket_name = "dockstudio-downloads"
