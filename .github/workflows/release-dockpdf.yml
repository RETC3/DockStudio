# Release di DockPDF: si avvia con un tag, per esempio
#   git tag -a dockpdf-v0.1.0 -m "Novità della versione (testo che l'app mostra nell'aggiornamento)"
#   git push origin dockpdf-v0.1.0
# Esegue i controlli, compila l'exe autonomo (x64 e ARM64), la versione portatile e l'installer, carica tutto
# su Cloudflare R2 (bucket dockstudio-downloads, cartella dockpdf/) e per ultimo latest.json: da quel momento
# getdockstudio.it/dockpdf/download/... serve i file e le copie installate propongono l'aggiornamento.
# Crea anche la release (privata) in questo repository, come archivio. Secret: CLOUDFLARE_API_TOKEN e
# CLOUDFLARE_ACCOUNT_ID (gli stessi del sito). Il messaggio del tag annotato diventa il testo delle novità.
name: Release DockPDF

on:
  push:
    tags: ['dockpdf-v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Versione da compilare senza pubblicare (es. 0.2.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BUCKET: dockstudio-downloads
      AVALONIA_TELEMETRY_OPTOUT: '1'
    steps:
      - name: Secret di Cloudflare
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          # Senza i secret i file non arriverebbero sul sito: meglio fermarsi prima di compilare.
          if (-not $env:CLOUDFLARE_API_TOKEN -or -not $env:CLOUDFLARE_ACCOUNT_ID) {
            throw "Mancano i secret CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID: release non pubblicata."
          }

      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Versione
        id: version
        shell: pwsh
        run: |
          $v = if ('${{ github.event_name }}' -eq 'push') { '${{ github.ref_name }}'.Replace('dockpdf-v', '') } else { '${{ inputs.version }}' }
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "Versione non valida: $v" }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }
          "${env:ProgramFiles(x86)}\Inno Setup 6" >> $env:GITHUB_PATH

      - name: Controlli automatici
        shell: pwsh
        run: dotnet run --project tests/DockPDF.Checks -c Release -- "$env:RUNNER_TEMP/dockpdf-checks"

      - name: Pubblicazione, zip e installer
        shell: pwsh
        run: ./scripts/publish-dockpdf.ps1 -Version ${{ steps.version.outputs.version }} -Zip -Installer

      - name: Novità e latest.json
        shell: pwsh
        run: |
          $v = '${{ steps.version.outputs.version }}'
          # Novità: il messaggio del tag annotato (git tag -a ... -m "..."), se c'è.
          $message = ''
          if ('${{ github.event_name }}' -eq 'push') {
            git fetch --force origin "refs/tags/dockpdf-v${v}:refs/tags/dockpdf-v${v}" 2>$null
            $message = (git for-each-ref "refs/tags/dockpdf-v$v" --format='%(contents)' | Out-String).Trim()
          }
          if (-not $message) { $message = "DockPDF $v" }
          [IO.File]::WriteAllText("$PWD/dist/notes.md", $message + "`n")
          ./scripts/make-app-latest.ps1 -App DockPDF -Version $v -NotesFile dist/notes.md

      - uses: actions/upload-artifact@v5
        with:
          name: DockPDF-${{ steps.version.outputs.version }}
          path: |
            dist/DockPDF-Setup-*.exe
            dist/DockPDF-*.zip
            dist/SHA256SUMS-*.txt
            dist/dockpdf/latest.json

      - name: Caricamento su Cloudflare R2
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $v = '${{ steps.version.outputs.version }}'
          $buckets = npx --yes wrangler@4 r2 bucket list 2>$null | Out-String
          if ($buckets -notmatch $env:BUCKET) {
            npx --yes wrangler@4 r2 bucket create $env:BUCKET
            if ($LASTEXITCODE -ne 0) { throw "Bucket R2 $env:BUCKET non disponibile" }
          }
          function Put($file, $key, $type) {
            npx --yes wrangler@4 r2 object put "$env:BUCKET/dockpdf/$key" --file $file --content-type $type --remote
            if ($LASTEXITCODE -ne 0) { throw "Caricamento di $key su R2 non riuscito" }
          }
          Put "dist/DockPDF-Setup-$v.exe" "DockPDF-Setup-$v.exe" 'application/vnd.microsoft.portable-executable'
          Put "dist/DockPDF-$v-win-x64.zip" "DockPDF-$v-win-x64.zip" 'application/zip'
          Put "dist/DockPDF-$v-win-arm64.zip" "DockPDF-$v-win-arm64.zip" 'application/zip'
          Put "dist/SHA256SUMS-$v.txt" "SHA256SUMS-$v.txt" 'text/plain'
          # Per ultimo: le app vedono la nuova versione solo quando i file sono già scaricabili.
          Put "dist/dockpdf/latest.json" "latest.json" 'application/json'

      - name: Controllo dei download
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $v = '${{ steps.version.outputs.version }}'
          $ok = $false
          for ($i = 0; $i -lt 12 -and -not $ok; $i++) {
            try {
              $latest = Invoke-RestMethod "https://getdockstudio.it/dockpdf/latest.json" -Headers @{ 'Cache-Control' = 'no-cache' }
              $head = Invoke-WebRequest "https://getdockstudio.it/dockpdf/download/DockPDF-Setup-$v.exe" -Method Head -UseBasicParsing
              $ok = $latest.tag_name -eq "v$v" -and $head.StatusCode -eq 200
            } catch { }
            if (-not $ok) { Start-Sleep 10 }
          }
          if (-not $ok) { "::warning::getdockstudio.it non serve ancora la versione $v (cache o sito senza il bucket): controlla a mano." }
          else { "getdockstudio.it serve DockPDF $v" }

      - name: Release (archivio in questo repository)
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = '${{ steps.version.outputs.version }}'
          gh release create "dockpdf-v$v" `
            "dist/DockPDF-Setup-$v.exe" "dist/DockPDF-$v-win-x64.zip" "dist/DockPDF-$v-win-arm64.zip" "dist/SHA256SUMS-$v.txt" `
            --title "DockPDF $v" --notes-file dist/notes.md
